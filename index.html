<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Gin Rummy Scorepad</title>
<meta name="description" content="A scorepad for Gin Rummy — track hands, running totals and winners." />
<meta name="theme-color" content="#ECE6D3" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:        #ECE6D3;
    --paper-warm:   #E4DCC2;
    --ink:          #1B1D22;
    --ink-muted:    #726954;
    --rule:         #3F5975;      /* ledger-blue horizontal rules */
    --rule-soft:    #B7C1CE;      /* faint gridlines */
    --red:          #A81E2C;      /* playing-card red, column separators, key actions */
    --red-soft:     #E8B8BD;
    --green:        #2E5B3E;      /* gin bonus, positive states */
    --shadow:       0 1px 0 rgba(27,29,34,.06);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background: var(--paper);
    /* Faint horizontal ruling like a scorepad */
    background-image:
      linear-gradient(to bottom, transparent 31px, rgba(63,89,117,.10) 32px);
    background-size: 100% 32px;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Type ------------------------------------------------------- */
  .display{
    font-family:'Fraunces', 'Times New Roman', serif;
    font-optical-sizing:auto;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .num{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings:'tnum';
  }

  /* Shell ------------------------------------------------------ */
  .shell{
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 24px 120px;
  }

  /* Masthead --------------------------------------------------- */
  .mast{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    padding-bottom:14px;
    border-bottom: 1px solid var(--ink);
    margin-bottom: 24px;
  }
  .mast h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size: clamp(34px, 6vw, 52px);
    line-height:.95;
    margin:0;
    letter-spacing:-.015em;
  }
  .mast h1 .amp{
    color: var(--red);
    font-style:normal;
    font-weight:600;
    padding: 0 .05em;
  }
  .meta{
    text-align:right;
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.4;
  }
  .meta .num{ color: var(--ink); }

  /* Setup card ------------------------------------------------- */
  .setup{
    background: var(--paper-warm);
    border: 1px solid var(--ink);
    padding: 28px;
    max-width: 540px;
    margin: 40px auto;
    box-shadow: 6px 6px 0 rgba(27,29,34,.08);
  }
  .setup h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
  }
  .setup p.lede{
    margin: 0 0 24px;
    color: var(--ink-muted);
    font-size:14px;
    line-height:1.5;
  }
  .field{
    display:block;
    margin-bottom:18px;
  }
  .field > label{
    display:block;
    font-size:12px;
    letter-spacing:.02em;
    color: var(--ink-muted);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input[type=text], .field input[type=number]{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    padding: 4px 0 6px;
    color: var(--ink);
    outline: none;
  }
  .field input:focus{
    border-bottom-color: var(--red);
  }
  .field.num-field input{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
  }
  .players-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  /* Buttons ---------------------------------------------------- */
  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    padding: 12px 20px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    cursor:pointer;
    transition: transform .08s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.red{ background: var(--red); border-color: var(--red); }
  .btn.ghost{
    background:transparent; color: var(--ink);
  }
  .btn.ghost:hover{ background: rgba(27,29,34,.06); }
  .btn.sm{ padding: 8px 14px; font-size:13px; }
  .btn-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* Scorepad --------------------------------------------------- */
  .pad{
    background: var(--paper-warm);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(27,29,34,.08);
  }
  .pad-head{
    display:grid;
    grid-template-columns: repeat(var(--cols, 2), 1fr);
    border-bottom: 2px solid var(--ink);
    position: relative;
  }
  .pad-head > .col-head{
    padding: 18px 16px 14px;
    text-align:center;
    position: relative;
  }
  .pad-head > .col-head + .col-head::before{
    content:'';
    position:absolute; left:0; top:12px; bottom:12px;
    width:2px; background: var(--red);
  }
  .col-head .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 20px;
    color: var(--ink);
    line-height: 1.1;
    word-break: break-word;
  }
  .col-head .name.leader::after{
    content:'★';
    color: var(--red);
    font-size: 14px;
    vertical-align: super;
    margin-left: 4px;
  }
  .col-head .total{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: clamp(48px, 10vw, 76px);
    line-height:1;
    margin-top: 10px;
    letter-spacing:-.02em;
  }
  .col-head .total.over{ color: var(--red); }
  .col-head .subtotal-note{
    font-size:11px;
    color: var(--ink-muted);
    margin-top: 6px;
    height: 14px;
  }

  .pad-body{
    display:grid;
    grid-template-columns: repeat(var(--cols, 2), 1fr);
    min-height: 240px;
    position: relative;
  }
  .pad-body > .col{
    padding: 8px 0;
    position: relative;
  }
  .pad-body > .col + .col::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0;
    width:2px; background: var(--red);
  }
  .hand-row{
    display:grid;
    grid-template-columns: 44px 1fr 44px;
    align-items:center;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(63,89,117,.22);
    min-height: 32px;
  }
  .hand-row .idx{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
  }
  .hand-row .amt{
    font-family:'JetBrains Mono', monospace;
    font-size: 20px;
    text-align:center;
    font-weight:500;
  }
  .hand-row .amt.zero{ color: var(--ink-muted); }
  .hand-row .tag{
    font-size: 10px;
    letter-spacing:.04em;
    color: var(--green);
    text-align:right;
    font-weight:600;
  }
  .hand-row .tag.undercut{ color: var(--red); }

  .pad-empty{
    grid-column: 1 / -1;
    text-align:center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size: 18px;
  }

  /* Entry form ------------------------------------------------- */
  .entry{
    margin-top: 24px;
    background: var(--paper-warm);
    border: 1px solid var(--ink);
    padding: 20px;
  }
  .entry h3{
    margin:0 0 14px;
    font-family:'Fraunces', serif;
    font-size: 18px;
    font-weight:600;
  }
  .entry-grid{
    display:grid;
    grid-template-columns: repeat(var(--cols, 2), 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .entry-col{
    padding: 12px;
    border: 1px dashed rgba(27,29,34,.3);
  }
  .entry-col .who{
    font-family:'Fraunces', serif;
    font-size: 15px;
    font-weight:600;
    margin-bottom: 8px;
    color: var(--ink);
  }
  .entry-col input[type=number]{
    width:100%;
    background:transparent;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size: 26px;
    padding: 4px 0;
    color: var(--ink);
    outline: none;
    -moz-appearance: textfield;
  }
  .entry-col input[type=number]::-webkit-outer-spin-button,
  .entry-col input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance: none; margin:0;
  }
  .entry-col input:focus{ border-bottom-color: var(--red); }
  .bonus-row{
    margin-top: 10px;
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip{
    font-size: 11px;
    padding: 4px 8px;
    border: 1px solid var(--ink-muted);
    background: transparent;
    color: var(--ink-muted);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    font-weight: 500;
    letter-spacing: .02em;
    transition: all .1s;
  }
  .chip:hover{ border-color: var(--ink); color: var(--ink); }
  .chip.on{
    background: var(--green);
    color: var(--paper);
    border-color: var(--green);
  }
  .chip.on.undercut{
    background: var(--red);
    border-color: var(--red);
  }

  .entry-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 12px;
    flex-wrap:wrap;
  }
  .entry-hint{
    font-size: 12px;
    color: var(--ink-muted);
    line-height:1.4;
  }
  kbd{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 1px 5px;
    border: 1px solid var(--ink-muted);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--paper);
  }

  /* Footer toolbar --------------------------------------------- */
  .toolbar{
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed rgba(27,29,34,.25);
    display:flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar .btn{ background:transparent; color: var(--ink); }
  .toolbar .btn:hover{ background: rgba(27,29,34,.06); }
  .toolbar .btn.danger{ color: var(--red); border-color: var(--red); }
  .toolbar .btn.danger:hover{ background: rgba(168,30,44,.08); }

  /* Winner overlay --------------------------------------------- */
  .veil{
    position: fixed; inset: 0;
    background: rgba(27,29,34,.5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .winner-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    padding: 40px;
    text-align:center;
    max-width: 460px;
    width: 100%;
    box-shadow: 10px 10px 0 var(--red);
    position:relative;
  }
  .winner-card .stamp{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:14px;
    color: var(--ink-muted);
    letter-spacing:.05em;
  }
  .winner-card h2{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 44px;
    margin: 6px 0 18px;
    line-height:1;
    color: var(--red);
  }
  .winner-card .score-line{
    font-family:'JetBrains Mono', monospace;
    font-size: 18px;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .winner-card .score-line .w{ color: var(--red); font-weight:700; }

  /* Small screens ---------------------------------------------- */
  @media (max-width: 640px){
    body{ background-size: 100% 28px; background-image: linear-gradient(to bottom, transparent 27px, rgba(63,89,117,.10) 28px); }
    .shell{ padding: 20px 14px 100px; }
    .mast{ flex-direction: column; align-items: flex-start; gap: 8px; }
    .meta{ text-align:left; }
    .setup{ padding: 22px; }
    .players-grid{ grid-template-columns: 1fr; }
    .col-head .total{ font-size: 52px; }
    .col-head .name{ font-size: 16px; }
    .hand-row{ grid-template-columns: 32px 1fr 40px; padding: 5px 8px; }
    .hand-row .amt{ font-size: 17px; }
    .entry{ padding: 14px; }
    .entry-grid{ gap: 10px; }
    .entry-col{ padding: 10px; }
    .winner-card{ padding: 28px 20px; }
    .winner-card h2{ font-size: 34px; }
  }

  /* Reduced motion --------------------------------------------- */
  @media (prefers-reduced-motion: reduce){
    .btn{ transition: none; }
  }

  /* Focus visibility ------------------------------------------- */
  :focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  .btn:focus-visible, .chip:focus-visible{
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="shell" id="app"></div>

<script>
'use strict';

/* ---------------------------------------------------------------
   State + persistence
--------------------------------------------------------------- */
const STORAGE_KEY = 'gin-rummy-scorepad:v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    // Basic shape validation
    if(!parsed || !Array.isArray(parsed.players)) return null;
    return parsed;
  } catch(e){ return null; }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* private mode / quota — nothing we can do */ }
}

// Default state — setup screen
let state = loadState() || {
  phase: 'setup',                 // 'setup' | 'play'
  players: [                      // { name }
    { name: '' },
    { name: '' }
  ],
  target: 100,
  ginBonus: 25,
  undercutBonus: 25,
  hands: []                       // [{ points:[n,n], bonuses:[null|'gin'|'undercut', ...] }]
};

/* ---------------------------------------------------------------
   Score calculations
--------------------------------------------------------------- */
function handTotal(hand, playerIdx){
  const base = Number(hand.points[playerIdx]) || 0;
  const bonus = hand.bonuses && hand.bonuses[playerIdx];
  if(bonus === 'gin')       return base + state.ginBonus;
  if(bonus === 'undercut')  return base + state.undercutBonus;
  return base;
}

function runningTotal(playerIdx){
  return state.hands.reduce((sum, h) => sum + handTotal(h, playerIdx), 0);
}

function leaderIndex(){
  const totals = state.players.map((_, i) => runningTotal(i));
  const max = Math.max(...totals);
  if(max === 0) return -1;
  const leaders = totals.map((t, i) => t === max ? i : -1).filter(i => i >= 0);
  return leaders.length === 1 ? leaders[0] : -1;   // tie → no leader star
}

function winnerIndex(){
  for(let i = 0; i < state.players.length; i++){
    if(runningTotal(i) >= state.target) return i;
  }
  return -1;
}

/* ---------------------------------------------------------------
   Rendering
--------------------------------------------------------------- */
const app = document.getElementById('app');

// Escape user-provided text before dropping into innerHTML
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function render(){
  if(state.phase === 'setup'){ renderSetup(); }
  else                       { renderGame(); }
}

/* --- Setup screen ---------------------------------------------- */
function renderSetup(){
  const p = state.players;
  app.innerHTML = `
    <header class="mast">
      <h1>Gin<span class="amp">·</span>Rummy<br/><span style="font-size:.55em; font-style:italic; font-weight:400; color:var(--ink-muted)">a scorepad</span></h1>
    </header>

    <section class="setup">
      <h2>New game</h2>
      <p class="lede">Enter the players' names and the target score. The pad remembers everything so you can close this tab and pick it up later.</p>

      <div class="players-grid">
        <div class="field">
          <label for="p0">Player one</label>
          <input id="p0" type="text" autocomplete="off" value="${esc(p[0].name)}" placeholder="Name" maxlength="30"/>
        </div>
        <div class="field">
          <label for="p1">Player two</label>
          <input id="p1" type="text" autocomplete="off" value="${esc(p[1].name)}" placeholder="Name" maxlength="30"/>
        </div>
      </div>

      <div class="field num-field" style="max-width:180px">
        <label for="target">Game to</label>
        <input id="target" type="number" min="10" max="1000" step="10" value="${state.target}"/>
      </div>

      <div class="btn-row" style="margin-top:8px">
        <button class="btn red" id="startBtn">Start game</button>
      </div>
    </section>
  `;

  const start = () => {
    const n0 = document.getElementById('p0').value.trim() || 'Player 1';
    const n1 = document.getElementById('p1').value.trim() || 'Player 2';
    const t  = Math.max(10, Math.min(1000, parseInt(document.getElementById('target').value, 10) || 100));
    state.players = [{ name: n0 }, { name: n1 }];
    state.target  = t;
    state.hands   = [];
    state.phase   = 'play';
    saveState();
    render();
  };

  document.getElementById('startBtn').addEventListener('click', start);
  ['p0','p1','target'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); start(); }
    });
  });
  document.getElementById('p0').focus();
}

/* --- Game screen ----------------------------------------------- */
// UI-only state for the current entry form
const entry = {
  points: [null, null],
  bonuses: [null, null]
};

function renderGame(){
  const cols = state.players.length;
  const leader = leaderIndex();
  const winner = winnerIndex();

  const totalCells = state.players.map((pl, i) => {
    const total = runningTotal(i);
    const over = total >= state.target;
    const isLeader = i === leader;
    const remaining = state.target - total;
    return `
      <div class="col-head">
        <div class="name display ${isLeader ? 'leader' : ''}">${esc(pl.name)}</div>
        <div class="total num ${over ? 'over' : ''}">${total}</div>
        <div class="subtotal-note">${over ? 'reached target' : remaining > 0 ? remaining + ' to go' : ''}</div>
      </div>`;
  }).join('');

  const handRows = state.players.map((_, playerIdx) => {
    if(state.hands.length === 0){
      return `<div class="col"></div>`;
    }
    const rows = state.hands.map((h, hIdx) => {
      const amt = handTotal(h, playerIdx);
      const bonus = h.bonuses && h.bonuses[playerIdx];
      const tag = bonus === 'gin' ? '<span class="tag">GIN</span>'
                : bonus === 'undercut' ? '<span class="tag undercut">UND</span>'
                : '<span></span>';
      return `
        <div class="hand-row">
          <span class="idx">${hIdx + 1}</span>
          <span class="amt num ${amt === 0 ? 'zero' : ''}">${amt > 0 ? '+' + amt : amt}</span>
          ${tag}
        </div>`;
    }).join('');
    return `<div class="col">${rows}</div>`;
  }).join('');

  const emptyBody = state.hands.length === 0
    ? `<div class="pad-empty">No hands scored yet. Deal and record the first hand below.</div>`
    : '';

  app.innerHTML = `
    <header class="mast">
      <h1>Gin<span class="amp">·</span>Rummy</h1>
      <div class="meta">
        game to <span class="num">${state.target}</span><br/>
        hand <span class="num">${state.hands.length + 1}</span>
      </div>
    </header>

    <section class="pad" style="--cols:${cols}">
      <div class="pad-head">${totalCells}</div>
      <div class="pad-body">
        ${emptyBody || handRows}
      </div>
    </section>

    ${winner >= 0 ? '' : renderEntry(cols)}

    <div class="toolbar">
      <div class="btn-row">
        <button class="btn sm" id="undoBtn" ${state.hands.length === 0 ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>Undo last hand</button>
      </div>
      <div class="btn-row">
        <button class="btn sm danger" id="newBtn">New game</button>
      </div>
    </div>

    ${winner >= 0 ? renderWinner(winner) : ''}
  `;

  wireGame();
}

function renderEntry(cols){
  const cells = state.players.map((pl, i) => {
    const val = entry.points[i] == null ? '' : entry.points[i];
    const bonus = entry.bonuses[i];
    return `
      <div class="entry-col">
        <div class="who">${esc(pl.name)}</div>
        <input type="number" inputmode="numeric" step="1" min="0" data-idx="${i}"
               class="entry-input" value="${val}" placeholder="0"/>
        <div class="bonus-row">
          <button class="chip ${bonus === 'gin' ? 'on' : ''}" data-bonus="gin" data-idx="${i}">Gin +${state.ginBonus}</button>
          <button class="chip undercut ${bonus === 'undercut' ? 'on' : ''}" data-bonus="undercut" data-idx="${i}">Undercut +${state.undercutBonus}</button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <section class="entry">
      <h3>Record hand ${state.hands.length + 1}</h3>
      <div class="entry-grid" style="--cols:${cols}">${cells}</div>
      <div class="entry-actions">
        <div class="entry-hint">
          The knocker gets the deadwood difference. Tap <em>Gin</em> or <em>Undercut</em> to add the bonus. Press <kbd>Enter</kbd> to record.
        </div>
        <button class="btn red" id="recordBtn">Record hand</button>
      </div>
    </section>
  `;
}

function renderWinner(idx){
  const w  = state.players[idx];
  const wt = runningTotal(idx);
  const others = state.players
    .map((p, i) => i === idx ? null : `<div>${esc(p.name)} &nbsp; <span class="num">${runningTotal(i)}</span></div>`)
    .filter(Boolean).join('');
  return `
    <div class="veil" id="veil">
      <div class="winner-card">
        <div class="stamp">game to ${state.target}</div>
        <h2>${esc(w.name)} wins</h2>
        <div class="score-line">
          <div><span class="w">${esc(w.name)}</span> &nbsp; <span class="num">${wt}</span></div>
          ${others}
        </div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn ghost" id="closeVeil">Keep viewing</button>
          <button class="btn red" id="newFromWin">New game</button>
        </div>
      </div>
    </div>
  `;
}

/* --- Event wiring ---------------------------------------------- */
function wireGame(){
  // Bonus chips
  document.querySelectorAll('.chip[data-bonus]').forEach(chip => {
    chip.addEventListener('click', () => {
      const i = Number(chip.dataset.idx);
      const b = chip.dataset.bonus;
      entry.bonuses[i] = entry.bonuses[i] === b ? null : b;
      render();
      // restore focus to the input for that player
      const inp = document.querySelector(`.entry-input[data-idx="${i}"]`);
      if(inp) inp.focus();
    });
  });

  // Number inputs — track edits, wire Enter to submit
  document.querySelectorAll('.entry-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const i = Number(inp.dataset.idx);
      const v = inp.value === '' ? null : Math.max(0, Math.floor(Number(inp.value) || 0));
      entry.points[i] = v;
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); tryRecord(); }
    });
  });

  const rec = document.getElementById('recordBtn');
  if(rec) rec.addEventListener('click', tryRecord);

  const undo = document.getElementById('undoBtn');
  if(undo && !undo.disabled){
    undo.addEventListener('click', () => {
      if(state.hands.length === 0) return;
      state.hands.pop();
      saveState();
      render();
    });
  }

  document.getElementById('newBtn').addEventListener('click', () => {
    if(confirm('Start a new game? The current scorepad will be cleared.')){
      // Keep the players but reset the game
      state.hands = [];
      state.phase = 'setup';
      entry.points = [null, null];
      entry.bonuses = [null, null];
      saveState();
      render();
    }
  });

  // Winner overlay wiring
  const closeV = document.getElementById('closeVeil');
  if(closeV) closeV.addEventListener('click', () => {
    document.getElementById('veil').remove();
  });
  const newFromWin = document.getElementById('newFromWin');
  if(newFromWin) newFromWin.addEventListener('click', () => {
    state.hands = [];
    state.phase = 'setup';
    entry.points = [null, null];
    entry.bonuses = [null, null];
    saveState();
    render();
  });
}

function tryRecord(){
  // Treat blank as 0 — a player often scores nothing on a hand
  const points  = entry.points.map(v => v == null ? 0 : v);
  const bonuses = entry.bonuses.slice();

  // Sanity: at least one player scored something, OR a bonus is set
  const anythingHappened = points.some(v => v > 0) || bonuses.some(b => b);
  if(!anythingHappened){
    // Gentle nudge — flash the record button rather than alerting
    const btn = document.getElementById('recordBtn');
    if(btn){
      btn.animate(
        [{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],
        {duration:220}
      );
    }
    return;
  }

  state.hands.push({
    points: points,
    bonuses: bonuses
  });
  entry.points  = [null, null];
  entry.bonuses = [null, null];
  saveState();
  render();

  // Refocus first entry input for fast successive entry (unless game over)
  setTimeout(() => {
    const first = document.querySelector('.entry-input[data-idx="0"]');
    if(first) first.focus();
  }, 0);
}

/* ---------------------------------------------------------------
   Boot
--------------------------------------------------------------- */
render();
</script>
</body>
</html>
